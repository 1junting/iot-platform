services:
  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    environment: {COLLECTOR_ZIPKIN_HOST_PORT: ':9411'}
    ports: ['127.0.0.1:8190:16686']
    networks: [lab]
  prometheus:
    image: prom/prometheus:v3.2.1
    command: ['--config.file=/etc/prometheus/prometheus.yml','--storage.tsdb.retention.time=7d']
    ports: ['127.0.0.1:9098:9090']
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [lab]
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GRAFANA_WEBHOOK_TOKEN: ${SERVICE_TOKEN}
    ports: ['127.0.0.1:3098:3000']
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [lab]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.10
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: '-Xms384m -Xmx384m'
    volumes: [elastic-data:/usr/share/elasticsearch/data]
    networks: [lab]
  logstash:
    build: infrastructure/elk
    environment:
      LS_JAVA_OPTS: '-Xms192m -Xmx192m'
    networks: [lab]
    depends_on: [elasticsearch]
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.10
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      NODE_OPTIONS: '--max-old-space-size=512'
    ports: ['127.0.0.1:5696:5601']
    networks: [lab]
    depends_on: [elasticsearch]
volumes:
  prometheus-data: {}
  grafana-data: {}
  elastic-data: {}
