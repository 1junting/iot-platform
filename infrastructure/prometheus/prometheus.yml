global:
  scrape_interval: 5s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: exchange
    static_configs: [{targets: ['exchange:8050']}]
  - job_name: services
    static_configs: [{targets: ['edge1:8050', 'edge2:8050', 'edge3:8050', 'devices:8050', 'analytics:8050', 'collector:8050', 'auth:8050']}]
  - job_name: worker
    static_configs: [{targets: ['worker:8071']}]
  - job_name: proa
    static_configs: [{targets: ['proa:8070']}]
  - job_name: prometheus
    static_configs: [{targets: ['localhost:9090']}]

  - job_name: kubernetes-federation
    honor_labels: true
    metrics_path: /federate
    params:
      match[]: ['{__name__=~"exchange_.*|up"}']
    static_configs: [{targets: ['k3s:30090']}]
