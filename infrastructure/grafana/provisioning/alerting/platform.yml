{
  "apiVersion": 1,
  "groups": [
    {
      "orgId": 1,
      "name": "iot-health",
      "folder": "IoT",
      "interval": "10s",
      "rules": [
        {
          "uid": "iot-down",
          "title": "Exchange unavailable",
          "condition": "B",
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 60,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "up{job=\"exchange\"}",
                "instant": true,
                "range": false
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "model": {
                "refId": "B",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "lt",
                      "params": [
                        1
                      ]
                    },
                    "operator": {
                      "type": "and"
                    },
                    "query": {
                      "params": [
                        "B"
                      ]
                    },
                    "reducer": {
                      "type": "last"
                    },
                    "type": "query"
                  }
                ]
              }
            }
          ],
          "noDataState": "Alerting",
          "execErrState": "Alerting",
          "for": "10s",
          "annotations": {
            "summary": "Exchange scrape unavailable"
          },
          "labels": {
            "severity": "critical"
          },
          "isPaused": false
        }
      ]
    }
  ],
  "contactPoints": [
    {
      "orgId": 1,
      "name": "platform-inbox",
      "receivers": [
        {
          "uid": "platform-webhook",
          "type": "webhook",
          "disableResolveMessage": false,
          "settings": {
            "url": "http://analytics:8050/api/v1/alerts",
            "authorization_scheme": "Bearer",
            "authorization_credentials": "$GRAFANA_WEBHOOK_TOKEN"
          }
        }
      ]
    }
  ],
  "policies": [
    {
      "orgId": 1,
      "receiver": "platform-inbox",
      "group_by": [
        "alertname"
      ],
      "group_wait": "5s",
      "group_interval": "10s",
      "repeat_interval": "4h"
    }
  ]
}