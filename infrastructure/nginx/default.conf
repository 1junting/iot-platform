limit_req_zone $binary_remote_addr zone=api:10m rate=200r/s;
limit_req_zone $binary_remote_addr zone=login:1m rate=5r/m;
server {
  listen 8080;
  client_max_body_size 256k;
  resolver 127.0.0.11 valid=5s ipv6=off;
  location /health { return 200 '{"status":"ready"}'; add_header Content-Type application/json; }
  location /auth/ { limit_req zone=login burst=5 nodelay; set $backend auth:8050; rewrite ^/auth/(.*)$ /$1 break; proxy_pass http://$backend; }
  location /devices/ { limit_req zone=api burst=100 nodelay; set $backend devices:8050; rewrite ^/devices/(.*)$ /$1 break; proxy_pass http://$backend; }
  location /analytics/ { limit_req zone=api burst=100 nodelay; set $backend analytics:8050; rewrite ^/analytics/(.*)$ /$1 break; proxy_pass http://$backend; }
  location /exchange/ { limit_req zone=api burst=100 nodelay; set $backend exchange:8050; rewrite ^/exchange/(.*)$ /$1 break; proxy_pass http://$backend; }
}
