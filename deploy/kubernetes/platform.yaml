apiVersion: v1
kind: ServiceAccount
metadata: {name: proa, namespace: iot-exchange}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: proa-hpa, namespace: iot-exchange}
rules:
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    resourceNames: [hdpcm-exchange]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: proa-hpa, namespace: iot-exchange}
subjects: [{kind: ServiceAccount, name: proa}]
roleRef: {kind: Role, name: proa-hpa, apiGroup: rbac.authorization.k8s.io}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: hdpcm-exchange, namespace: iot-exchange}
spec:
  replicas: 2
  selector: {matchLabels: {app: hdpcm-exchange, version: stable}}
  template:
    metadata: {labels: {app: hdpcm-exchange, version: stable}}
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector: {matchLabels: {app: hdpcm-exchange, version: stable}}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions: [{key: tier, operator: In, values: ['3']}]
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector: {matchLabels: {app: hdpcm-exchange}}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: exchange
          image: IMAGE_PLACEHOLDER
          envFrom: [{secretRef: {name: exchange-config}}]
          ports: [{name: http, containerPort: 8050}, {name: coap, containerPort: 5683, protocol: UDP}]
          resources:
            requests: {cpu: 100m, memory: 80Mi}
            limits: {cpu: 500m, memory: 160Mi}
          readinessProbe: {httpGet: {path: /health, port: 8050}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8050}, initialDelaySeconds: 20, periodSeconds: 10}
          securityContext: {runAsNonRoot: true, runAsUser: 10001, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: hdpcm-exchange, namespace: iot-exchange}
spec:
  type: NodePort
  selector: {app: hdpcm-exchange}
  ports: [{name: http, port: 8050, targetPort: 8050, nodePort: 30050}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: exchange-worker, namespace: iot-exchange}
spec:
  replicas: 2
  selector: {matchLabels: {app: exchange-worker}}
  template:
    metadata: {labels: {app: exchange-worker}, annotations: {sidecar.istio.io/inject: 'false'}}
    spec:
      nodeSelector: {tier: '2'}
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: IMAGE_PLACEHOLDER
          command: [python, -m, exchange.worker]
          envFrom: [{secretRef: {name: exchange-config}}]
          resources: {requests: {cpu: 50m, memory: 70Mi}, limits: {cpu: 500m, memory: 160Mi}}
          securityContext: {runAsNonRoot: true, runAsUser: 10001, allowPrivilegeEscalation: false}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: hdpcm-exchange, namespace: iot-exchange}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: hdpcm-exchange}
  minReplicas: 2
  maxReplicas: 4
  behavior: {scaleDown: {stabilizationWindowSeconds: 120}}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: exchange-available, namespace: iot-exchange}
spec: {minAvailable: 1, selector: {matchLabels: {app: hdpcm-exchange}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: proa, namespace: iot-exchange}
spec:
  replicas: 1
  selector: {matchLabels: {app: proa}}
  template:
    metadata: {labels: {app: proa}, annotations: {sidecar.istio.io/inject: 'false'}}
    spec:
      nodeSelector: {tier: '1'}
      serviceAccountName: proa
      containers:
        - name: proa
          image: IMAGE_PLACEHOLDER
          command: [uvicorn, exchange.predictor:app, --host, 0.0.0.0, --port, '8070', --no-access-log]
          envFrom: [{configMapRef: {name: proa-config}}]
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 160Mi}}
          securityContext: {runAsNonRoot: true, runAsUser: 10001, allowPrivilegeEscalation: false}
---
apiVersion: v1
kind: Service
metadata: {name: proa, namespace: iot-exchange}
spec:
  type: NodePort
  selector: {app: proa}
  ports: [{name: http, port: 8070, targetPort: 8070, nodePort: 30070}]
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata: {name: exchange, namespace: iot-exchange}
spec:
  host: hdpcm-exchange
  subsets:
    - name: stable
      labels: {version: stable}
    - name: canary
      labels: {version: canary}
  trafficPolicy:
    connectionPool:
      tcp: {maxConnections: 50}
      http: {http1MaxPendingRequests: 50, http2MaxRequests: 100}
    outlierDetection: {consecutive5xxErrors: 3, interval: 5s, baseEjectionTime: 10s, maxEjectionPercent: 100, minHealthPercent: 0}
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata: {name: exchange, namespace: iot-exchange}
spec:
  hosts: [hdpcm-exchange]
  http:
    - route:
        - destination: {host: hdpcm-exchange, subset: stable}
          weight: 100
        - destination: {host: hdpcm-exchange, subset: canary}
          weight: 0
      timeout: 10s
      retries: {attempts: 2, perTryTimeout: 2s, retryOn: 'connect-failure,reset,refused-stream,503,504'}
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata: {name: exchange-gateway, namespace: iot-exchange}
spec:
  selector: {istio: ingressgateway}
  servers:
    - port: {number: 80, name: http, protocol: HTTP}
      hosts: ['*']
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata: {name: exchange-public, namespace: iot-exchange}
spec:
  hosts: ['*']
  gateways: [exchange-gateway]
  http:
    - route:
        - destination: {host: hdpcm-exchange, port: {number: 8050}, subset: stable}
          weight: 100
        - destination: {host: hdpcm-exchange, port: {number: 8050}, subset: canary}
          weight: 0
      timeout: 10s
      retries: {attempts: 2, perTryTimeout: 2s, retryOn: 'connect-failure,reset,refused-stream,503,504'}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: jenkins-deployer, namespace: iot-exchange}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: jenkins-deployer, namespace: iot-exchange}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [hdpcm-exchange, exchange-worker]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: jenkins-deployer, namespace: iot-exchange}
subjects: [{kind: ServiceAccount, name: jenkins-deployer}]
roleRef: {kind: Role, name: jenkins-deployer, apiGroup: rbac.authorization.k8s.io}
